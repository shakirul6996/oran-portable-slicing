name: oran-portable

services:
  open5gs:
    container_name: oran-portable-open5gs
    image: ${OPEN5GS_IMAGE:-shakirulewu/oran-portable:open5gs-v1}
    privileged: true

    env_file:
      - ./open5gs/open5gs.env

    command:
      - 5gc
      - -c
      - open5gs-5gc.yml

    volumes:
      - ./open5gs/subscriber_db.csv:/open5gs/subscriber_db.csv:ro
      - ./open5gs/add_users.py:/open5gs/add_users.py:ro
      - ./open5gs/open5gs-5gc.yml.in:/open5gs/open5gs-5gc.yml.in:ro

    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.20 7777"]
      interval: 3s
      timeout: 1s
      retries: 60

    networks:
      ran:
        ipv4_address: 10.77.0.2

  flexric:
    container_name: oran-portable-flexric
    image: ${FLEXRIC_IMAGE:-shakirulewu/oran-portable:flexric-v1}

    volumes:
      - ./config/flexric.conf:/usr/local/etc/flexric/flexric.conf:ro

    networks:
      ran:
        ipv4_address: 10.77.0.3

  ns3-ran:
    container_name: oran-portable-ns3
    image: ${NS3_IMAGE:-shakirulewu/oran-portable:ns3-final}
    entrypoint: []

    environment:
      ORAN_RAN_IP: 10.77.0.10
      ORAN_AMF_IP: 10.77.0.2
      ORAN_CORE_IP: 10.77.0.2

    depends_on:
      open5gs:
        condition: service_healthy
      flexric:
        condition: service_started

    command:
      - bash
      - -lc
      - |
        set -o pipefail
        . /runtime-config/simulation.env
        : "$${N_UES:?Missing N_UES}"
        : "$${SIM_TIME:?Missing SIM_TIME}"

        mkdir -p /telemetry

        : > /logs/runtime-slice.log

        rm -f \
          /telemetry/energyfilecell*.csv \
          /telemetry/cu-cp-cell-*.txt \
          /telemetry/cu-up-cell-*.txt \
          /telemetry/du-cell-*.txt

        for cell in $$(seq 2 $$((N_GNBS + 1))); do
          for f in             "energyfilecell$${cell}.csv"             "cu-cp-cell-$${cell}.txt"             "cu-up-cell-$${cell}.txt"             "du-cell-$${cell}.txt"
          do
            rm -f "/opt/ns3/$$f"
            ln -s "/telemetry/$$f" "/opt/ns3/$$f"
          done
        done

        ./ns3 run "scratch/scenario-zero-slicing --ues=$${N_UES} --simTime=$${SIM_TIME} --e2TermIp=10.77.0.3 --N_MmWaveEnbNodes=$${N_GNBS} --Bandwidth=$${BANDWIDTH} --CenterFrequency=$${FREQUENCY} --IntersideDistanceCells=$${CELL_DISTANCE} --IntersideDistanceUEs=$${UE_DISTANCE} --N_AntennasMcUe=$${UE_ANTENNAS} --N_AntennasMmWave=$${GNB_ANTENNAS} --hoSinrDifference=$${HO_SINR} --indicationPeriodicity=$${E2_PERIOD}" \
          2>&1 | tee /logs/runtime-slice.log

    volumes:
      - ./runtime-config:/runtime-config:ro
      - ./logs:/logs
      - ./telemetry:/telemetry

    networks:
      ran:
        ipv4_address: 10.77.0.10

  influxdb:
    container_name: oran-portable-influxdb
    image: influxdb:1.8-alpine

    environment:
      INFLUXDB_DB: influx
      INFLUXDB_ADMIN_USER: admin
      INFLUXDB_ADMIN_PASSWORD: admin

    ports:
      - "127.0.0.1:8086:8086"

    healthcheck:
      test:
        - CMD-SHELL
        - influx -execute 'SHOW DATABASES' >/dev/null 2>&1
      interval: 2s
      timeout: 2s
      retries: 30

  gui:
    container_name: oran-portable-gui
    image: ${GUI_IMAGE:-shakirulewu/oran-portable:gui-final}

    network_mode: host

    depends_on:
      influxdb:
        condition: service_healthy

    environment:
      INFLUXDB_DATABASE: influx
      INFLUXDB_HOST: 127.0.0.1
      INFLUXDB_PORT: 8086
      INFLUXDB_USERNAME: admin
      INFLUXDB_PASSWORD: admin

      NS3_HOST: 127.0.0.1
      FLEXRIC_CONTAINER: oran-portable-flexric
      NS3_CONTAINER: oran-portable-ns3

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runtime-config:/runtime-config
      - ./gui-overrides/data_controller.py:/app/src/http/data_controller.py:ro
      - ./gui-overrides/simulation.py:/app/src/simulation_objects/simulation.py:ro

  gui-bridge:
    container_name: oran-portable-gui-bridge
    image: ${GUI_IMAGE:-shakirulewu/oran-portable:gui-final}
    restart: unless-stopped

    network_mode: host
    working_dir: /telemetry

    environment:
      GUI_SIM_ID: open5gs-slicing-demo
      GUI_UE_COUNT: 3
      GUI_BASELINE_DURATION_SEC: 10

    command:
      - python3
      - /app/gui_bridge.py

    volumes:
      - ./runtime-config:/runtime-config:ro
      - ./logs:/runtime-logs:ro
      - ./gui-overrides/gui_bridge.py:/app/gui_bridge.py:ro
      - ./telemetry:/telemetry

  gui-pusher:
    container_name: oran-portable-gui-pusher
    image: ${GUI_IMAGE:-shakirulewu/oran-portable:gui-final}
    restart: unless-stopped

    network_mode: host
    working_dir: /telemetry

    depends_on:
      influxdb:
        condition: service_healthy

    environment:
      INFLUXDB_DATABASE: influx
      INFLUXDB_HOST: 127.0.0.1
      INFLUXDB_PORT: 8086
      INFLUXDB_USERNAME: admin
      INFLUXDB_PASSWORD: admin

    command:
      - python3
      - /app/sim_data_pusher.py

    volumes:
      - ./telemetry:/telemetry
      - ./gui-overrides/sim_data_pusher.py:/app/sim_data_pusher.py:ro


networks:
  ran:
    name: oran_portable_ran
    driver: bridge
    ipam:
      config:
        - subnet: 10.77.0.0/24
          gateway: 10.77.0.1
